server:
  port: 8080
opd:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}      # service-account JSON; or use GOOGLE_APPLICATION_CREDENTIALS
    project-id: ${FIREBASE_PROJECT_ID:}
  ml-enabled: ${ML_ENABLED:false}                        # true only if the Python service is running
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: ${OPD_TIMEZONE:Asia/Kolkata}
  seed-enabled: ${OPD_SEED_ENABLED:false}
